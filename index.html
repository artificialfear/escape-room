<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Recital</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/tv.css">
<link rel="stylesheet" href="css/scenes.css">
</head>
<body class="asleep">
<div class="fog"></div><div class="fog b"></div><div class="vignette"></div>
<div id="app">
  <div class="topbar">
    <span class="brand">The Last Recital</span>
    <span class="act" id="act"></span>
    <span class="pdot" id="dot-mat"><i></i>Player 1</span>
    <span class="pdot" id="dot-emily"><i></i>Player 2</span>
    <span id="hintcount"></span>
    <span class="timer" id="timer"></span>
    <button class="gear" id="gear" title="Game menu">⚙</button>
  </div>
  <div id="stage"></div>
</div>
<div id="hint" class="hidden"></div>
<div id="banner" class="hidden"></div>
<div id="paused" class="hidden"><div class="cinzel">Paused</div><p>The house holds its breath…</p><p class="small">Tap <b>Resume</b> on either phone (or press P on the laptop).</p></div>
<div id="flash"></div>
<div id="wake">
  <div class="wake-in">
    <div class="wake-asleep">The house is asleep.</div>
    <h1 class="cinzel">The Last Recital</h1>
    <button class="btn primary" id="wakebtn">Wake the house</button>
    <p class="wake-note">This also turns on the sound. Browsers need one click first.</p>
  </div>
</div>
<script src="lib/peerjs.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="js/cards-data.js"></script>
<script src="js/sound.js"></script>
<script src="js/audiobank.js"></script>
<script src="js/notation.js"></script>
<script src="js/scenes.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script src="js/tv.js"></script>
</body>
</html>
