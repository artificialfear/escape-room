<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Last Recital · Phone</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/phone.css">
</head>
<body>
<div class="fog"></div><div class="vignette"></div>
<div id="app">
  <header>
    <span class="brand">The Last Recital</span>
    <span id="who"></span>
    <span id="conn" class="conn"><i></i><span>…</span></span>
  </header>
  <main id="main"></main>
  <footer id="footer" class="hidden">
    <button id="pagesbtn" class="fbtn">Pages <b id="pagecount">0</b></button>
    <button id="hintbtn" class="fbtn hint">Hint</button>
    <button id="pausebtn" class="fbtn pause" title="Pause the game">❚❚</button>
  </footer>
</div>
<div id="sheet" class="sheet hidden"><div class="sheet-in"><div class="sheet-h"><span id="sheet-title"></span><button id="sheet-x" class="x">✕</button></div><div id="sheet-body"></div></div></div>
<div id="scanner" class="sheet hidden"><div class="sheet-in">
  <div class="sheet-h"><span>Scan a page</span><button id="scan-x" class="x">✕</button></div>
  <div class="scanwrap"><video id="video" playsinline muted></video><div class="scanframe"></div></div>
  <div id="scanmsg" class="scanmsg">Point your camera at the code on the page.</div>
  <div class="manual"><input id="manual" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="or type the code"><button id="manualgo" class="btn">Enter</button></div>
</div></div>
<div id="toast"></div>
<div id="pausedov" class="hidden"><div class="cinzel">Paused</div><p>The house holds its breath…</p><button class="btn big primary" id="resumebtn">Resume</button></div>
<div id="lostov" class="hidden">Reconnecting to the TV… <span>Keep this page open. Your progress is saved.</span></div>
<canvas id="scancanvas" class="hidden"></canvas>
<script src="lib/peerjs.min.js"></script>
<script src="lib/jsQR.js"></script>
<script src="js/cards-data.js"></script>
<script src="js/sound.js"></script>
<script src="js/pitch.js"></script>
<script src="js/notation.js"></script>
<script src="js/net.js"></script>
<script src="js/phone.js"></script>
</body>
</html>
